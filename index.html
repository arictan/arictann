<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#2a1a33" />
    <title>Sushi Stack</title>
    <style>
      html, body { margin: 0; height: 100%; background: #2a1a33; overflow: hidden;
        touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
      canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; }
      /* Invisible probe used to read the device's safe-area insets from JS. */
      #safe { position: fixed; inset: 0; pointer-events: none; visibility: hidden;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="safe"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
